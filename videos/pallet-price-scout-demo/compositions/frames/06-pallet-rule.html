    (function () {
      var root = document.querySelector('[data-composition-id="06-pallet-rule"]');
      var $ = function (s) { return root.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      // Split a text node's element into per-character spans (built once, synchronously).
      function splitChars(el) {
        var text = el.textContent;
        el.textContent = "";
        var out = [];
        for (var i = 0; i < text.length; i++) {
          var s = document.createElement("span");
          s.textContent = text.charAt(i);
          el.appendChild(s);
          out.push(s);
        }
        return out;
      }

      var tl = gsap.timeline({ paused: true });

      // Macro camera — a barely-there push under the whole shot (breather frame).
      tl.fromTo("#f06-pallet-rule-cam", { scale: 1 }, { scale: 1.012, duration: 5, ease: "none" }, 0);

      // ── Scene 1 (0.0–1.0s): kicker, then the rule reveals per chunk; "× 1.30" lands last ──
      tl.fromTo("#f06-pallet-rule-kicker", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0.05);

      var chunks = $$("[data-f06-chunk]");
      var chunkAt = [0.16, 0.3, 0.42];
      for (var c = 0; c < 3; c++) {
        tl.fromTo(chunks[c], { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, chunkAt[c]);
      }
      tl.fromTo(chunks[3], { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.42, ease: "back.out(1.6)" }, 0.6);

      // Empty grid established: the four slot hairlines draw in left→right.
      var hairs = $$(".f06-pallet-rule-hair");
      hairs.forEach(function (h, i) {
        tl.fromTo(h, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 0.35 + i * 0.08);
      });

      // ── Scene 2 (1.0–3.0s): tier cards cascade in, one per beat; min retail writes in after each lands ──
      var cards = $$(".f06-pallet-rule-card");
      var stubs = $$(".f06-pallet-rule-stub");
      var mins = $$(".f06-pallet-rule-min");
      cards.forEach(function (card, i) {
        var land = 1.1 + i * 0.5;           // click-soft cues: 1.1 / 1.6 / 2.1 / 2.6
        tl.fromTo(card, { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, land - 0.2);
        tl.fromTo(stubs[i], { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, land);
        var chars = splitChars(mins[i]);
        tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.02 }, land + 0.05);
      });

      // ── Scene 3 (3.0–5.0s): the note types on beneath, then holds still ──
      var noteChars = splitChars($("#f06-pallet-rule-note-text"));

      var STEP = 0.02;
      var T0 = 3.05;
      tl.fromTo(noteChars, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", stagger: STEP }, T0);
      var caret = $("#f06-pallet-rule-caret");
      tl.fromTo(caret, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, T0 - 0.03);
      tl.fromTo(caret, { x: 0 }, { x: N * ADV, duration: N * STEP, ease: "steps(" + N + ")" }, T0);
      // Caret parks at the end of the line and the frame holds still (no exit, no blink-out).

      window.__timelines = window.__timelines || {};
