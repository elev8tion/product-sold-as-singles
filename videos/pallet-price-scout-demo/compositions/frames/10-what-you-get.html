  <div data-hf-id="hf-4ydw" id="root" data-composition-id="10-what-you-get" data-width="1920" data-height="1080" data-duration="6">

  <script>
    (function () {
      var ID = "10-what-you-get";
      var DURATION = 5;
      var root = document.querySelector('[data-composition-id="' + ID + '"]') || document;
      var q = function (sel) { return root.querySelectorAll(sel); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ── dynamic-content-sequencing: pre-compute every reveal time ONCE from content length ──
      // One slot per benefit line (~1.4s each, on the 0.3 / 1.7 / 3.1 click beats);
      // inside a slot the marker draws first, then words reveal with a gap that grows
      // with each word's character count — longer words earn more time.
      var SLOT = 1.4;          // Scene windows: 0.0–1.4 / 1.4–2.8 / 2.8–4.2
      var MARK_AT = 0.3;       // marker draw lands on the soft click
      var WORDS_AT = 0.48;     // first word follows the finished stroke
      var BASE_GAP = 0.05;     // BASE_DURATION per word
      var SEC_PER_CHAR = 0.012;
      var WORD_DUR = 0.42;

      var lines = Array.prototype.slice.call(q(".f10-what-you-get-line"));
      var TIMELINE = lines.map(function (line, i) {
        var slotStart = i * SLOT;
        var words = Array.prototype.slice.call(line.querySelectorAll(".f10-what-you-get-wi"));
        var cumulative = slotStart + WORDS_AT;
        var wordTimes = words.map(function (w) {
          var start = cumulative;
          cumulative += BASE_GAP + w.textContent.length * SEC_PER_CHAR;
          return { el: w, start: start };
        });
        return {
          mark: line.querySelector(".f10-what-you-get-mark"),
          markAt: slotStart + MARK_AT,
          words: wordTimes
        };
      });

      // ── Scene 1 (0.0–1.4s): kicker + rule stub open the field ──
      tl.fromTo(q(".f10-what-you-get-kicker"),
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.05);
      tl.fromTo(q(".f10-what-you-get-stub"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "power2.out" }, 0.12);

      // ── Scenes 1–3: each line — lime `/` draws (bottom → top), then per-word mask rise ──
      TIMELINE.forEach(function (entry) {
        tl.fromTo(entry.mark,
          { clipPath: "inset(100% 0% 0% 0%)", y: 10 },
          { clipPath: "inset(0% 0% 0% 0%)", y: 0, duration: 0.26, ease: "power2.out" },
          entry.markAt);
        entry.words.forEach(function (w) {
          tl.fromTo(w.el,
            { yPercent: 105, opacity: 0 },
            { yPercent: 0, opacity: 1, duration: WORD_DUR, ease: "power3.out" },
            w.start);
        });
      });

      // ── macro camera underneath: a faint, steady push; Scene 4 (4.2–5.0s) reads as a still hold ──
      tl.fromTo(q(".f10-what-you-get-cam"),
        { scale: 1 },
        { scale: 1.012, duration: DURATION, ease: "none" }, 0);

      window.__timelines[ID] = tl;
    })();
  </script>
