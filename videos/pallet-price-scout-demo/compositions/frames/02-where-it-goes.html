    .f02-where-it-goes-shot { position: absolute; left: 0; top: 0; width: 1920px; height: 1340px; display: block; }

      <div data-hf-id="hf-t6ti" id="f02-where-it-goes-window" class="f02-where-it-goes-window">

        <div data-hf-id="hf-t25f" class="f02-where-it-goes-route">

          <span data-hf-id="hf-lbrl" id="f02-where-it-goes-r1b" class="f02-where-it-goes-arrow"><svg data-hf-id="hf-hi21" viewBox="0 0 60 36" aria-hidden="true"><path data-hf-id="hf-68um" d="M3 18 H52 M38 5 L53 18 L38 31" fill="none" stroke="#E9E8DF" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" /></svg></span>
          <span data-hf-id="hf-0li6" id="f02-where-it-goes-r1c" class="f02-where-it-goes-chunk f02-where-it-goes-lime">the shelf.</span>

          <span data-hf-id="hf-atec" id="f02-where-it-goes-r2a" class="f02-where-it-goes-chunk">the rest</span>
          <span data-hf-id="hf-1ro4" id="f02-where-it-goes-r2b" class="f02-where-it-goes-arrow"><svg data-hf-id="hf-pztp" viewBox="0 0 60 36" aria-hidden="true"><path data-hf-id="hf-r2oi" d="M3 18 H52 M38 5 L53 18 L38 31" fill="none" stroke="#E9E8DF" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" /></svg></span>
          <span data-hf-id="hf-ksbm" id="f02-where-it-goes-r2c" class="f02-where-it-goes-chunk f02-where-it-goes-lime">value-backed</span>
          <span data-hf-id="hf-4648" id="f02-where-it-goes-r2d" class="f02-where-it-goes-chunk f02-where-it-goes-lime">pallets.</span>

  <script>
    (function () {
      var ID = "02-where-it-goes";
      var P = "#f02-where-it-goes-";
      var tl = gsap.timeline({ paused: true });

      // ---------------------------------------------------------------
      // Camera — zoom-out-workspace-reveal (sub-shape B), coordinate-target-zoom
      // reversed. One world (the real Overview, page css px), transform-origin
      // 0 0, single writer: point p -> T + S*p. Window viewport 994x600.
      // ---------------------------------------------------------------
      var VW = 994, VH = 600;
      var FX = 1623, FY = 602;            // "Where it goes." panel: header -> legend, centred
      var S0 = 1.9;                       // open tight
      var SD = 1.82;                      // end of the gentle pre-reveal drift (~4%)
      var S1 = VW / 1920;                 // wide: page x0-1920 fit to window width (shows y0-1160)
      var DRIFT_END = 2.8, LOCK = 4.1;
      var PANEL = { x: 1478, y: 445, w: 290, h: 492 }, OUT = 3;
      var driftEase = gsap.parseEase("power1.in");
      var revealEase = gsap.parseEase("expo.out");
      var TXD = VW / 2 - SD * FX, TYD = VH / 2 - SD * FY;

      function camAt(t) {
        var s, tx, ty, e;
        if (t <= DRIFT_END) {
          e = driftEase(Math.max(0, t) / DRIFT_END);
          s = S0 + (SD - S0) * e;
          tx = VW / 2 - s * FX; ty = VH / 2 - s * FY;
        } else if (t < LOCK) {
          e = revealEase((t - DRIFT_END) / (LOCK - DRIFT_END));
          s = SD + (S1 - SD) * e;
          tx = TXD * (1 - e); ty = TYD * (1 - e);
        } else {
          s = S1; tx = 0; ty = 0;
        }
        return { s: s, tx: tx, ty: ty };
      }

      var world = document.querySelector(P + "world");
      var track = document.querySelector(P + "track");
      function applyCam(t) {
        var c = camAt(t);
        world.style.transform = "translate(" + c.tx.toFixed(3) + "px," + c.ty.toFixed(3) + "px) scale(" + c.s.toFixed(5) + ")";
        track.style.left = (c.tx + c.s * PANEL.x - OUT).toFixed(2) + "px";
        track.style.top = (c.ty + c.s * PANEL.y - OUT).toFixed(2) + "px";
        track.style.width = (c.s * PANEL.w + OUT * 2).toFixed(2) + "px";
        track.style.height = (c.s * PANEL.h + OUT * 2).toFixed(2) + "px";
      }
      applyCam(0);
      var cam = { t: 0 };
      // the only camera tween; it ends at LOCK — no camera motion after the lock
      tl.to(cam, { t: LOCK, duration: LOCK, ease: "none", onUpdate: function () { applyCam(cam.t); } }, 0);

      // window present from the open
      tl.fromTo(P + "window", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
      tl.fromTo(P + "tag", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.3);

      // Scene 1 close-up micro-action — the real 40 / 166 / 9 bar fills left-to-right
      tl.fromTo(P + "mask-a", { scaleX: 1 }, { scaleX: 0, duration: 0.35, ease: "power2.out" }, 0.25);
      tl.fromTo(P + "mask-b", { scaleX: 1 }, { scaleX: 0, duration: 0.6, ease: "power2.inOut" }, 0.55);
      tl.fromTo(P + "mask-c", { scaleX: 1 }, { scaleX: 0, duration: 0.18, ease: "power2.out" }, 1.12);

      // lime marker locks onto the panel just before the pull, then rides it home
      tl.fromTo(P + "track", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.45);

      // ---------------------------------------------------------------
      // Scenes 1–2 — dynamic-content-sequencing: per-chunk reveal times
      // pre-computed from content length (BASE + chars * SEC_PER_CHAR).
      // ---------------------------------------------------------------
      var BASE = 0.2, SEC_PER_CHAR = 0.02, REVEAL = 0.45;
      var ROUTES = [
        { start: 0.2, chunks: [
          { id: "r1a", text: "best sellers" },
          { id: "r1b", text: "→", arrow: true },
          { id: "r1c", text: "the shelf." }
        ] },
        { start: 1.45, chunks: [
          { id: "r2a", text: "the rest" },
          { id: "r2b", text: "→", arrow: true },
          { id: "r2c", text: "value-backed" },
          { id: "r2d", text: "pallets." }
        ] }
      ];
      var SEQ = [];
      ROUTES.forEach(function (route) {
        var cumulative = route.start;
        route.chunks.forEach(function (c) {
          SEQ.push({ id: c.id, arrow: !!c.arrow, start: cumulative });
          cumulative += BASE + c.text.length * SEC_PER_CHAR;
        });
      });
      SEQ.forEach(function (c) {
        if (c.arrow) {
          tl.fromTo(P + c.id, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: REVEAL, ease: "power3.out" }, c.start);
        } else {
          tl.fromTo(P + c.id, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: REVEAL, ease: "power3.out" }, c.start);
        }
      });

      // Scene 3 — hairline under the two routes, then the verdict lands as the window locks
      tl.fromTo(P + "rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 3.45);
      tl.fromTo(P + "v1", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 3.72);
      tl.fromTo(P + "v2", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 3.86);

      // Scene 4 — the product named at the payoff: stub draws, mono kicker types on, then hold
      tl.fromTo(P + "stub", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 4.05);
      var KICKER = "PALLET PRICE SCOUT · INVENTORY ROUTING";
      var kickerText = document.querySelector(P + "kicker-text");
      var caret = document.querySelector(P + "caret");
      var lastCount = -1;
      // guarded writer: DOM touched only when the character count changes;
      // the caret shows only while characters are landing (hidden before + after)
      function applyKicker(n) {
        var count = Math.max(0, Math.min(KICKER.length, Math.floor(n)));
        if (count !== lastCount) {
          kickerText.textContent = KICKER.slice(0, count);
          caret.style.opacity = count > 0 && count < KICKER.length ? "1" : "0";
          lastCount = count;
        }
      }
      applyKicker(0);
      var type = { n: 0 };
      tl.to(type, { n: KICKER.length, duration: 0.9, ease: "none", onUpdate: function () { applyKicker(type.n); } }, 4.15);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
