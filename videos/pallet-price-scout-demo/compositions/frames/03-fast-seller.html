      tl.fromTo(P + "strip", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
      tl.fromTo(P + "cam", { scale: S0 }, { scale: S1, duration: ZOOM_DUR, ease: "expo.out" }, ZOOM_AT);
      tl.fromTo(P + "pan", { x: 140, y: 96 }, { x: 0, y: 0, duration: ZOOM_DUR, ease: "expo.out" }, ZOOM_AT);
      tl.fromTo([P + "dim-top", P + "dim-bot"], { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 0.9);

      tl.fromTo(P + "kicker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.05);
