  <script>
    (function () {
      var ID = "11-the-right-place";
      var scope = document.querySelector('[data-composition-id="' + ID + '"]') || document;
      var q = function (s) { return scope.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(scope.querySelectorAll(s)); };

      var tl = gsap.timeline({ paused: true });
      var DURATION = 4.5;

      var cam = q("#f11-the-right-place-cam");
      var mark = q("#f11-the-right-place-mark");
      var spokes = qa(".f11-the-right-place-spoke");
      var textEl = q("#f11-the-right-place-text");
      var cursorEl = q("#f11-the-right-place-cursor");
      var l1 = q("#f11-the-right-place-l1");
      var l2 = q("#f11-the-right-place-l2");
      var place = q("#f11-the-right-place-place");
      var rule = q("#f11-the-right-place-rule");
      var foot = q("#f11-the-right-place-foot");

      // Macro settle under the whole build (0–3.0s), then dead still for the hold.
      tl.fromTo(cam, { scale: 1.035 }, { scale: 1, duration: 3.0, ease: "power2.out", transformOrigin: "960px 514px" }, 0);

      // ── Scene 1 (0.0–1.0s): ✳ draws on spoke by spoke (svg-path-draw) ──
      var SPOKE_R = 86; // straight spoke: exact length = radius
      var SEG_1_START = 0.08, SEG_STAGGER = 0.1, SEG_DUR = 0.24;
      spokes.forEach(function (p, i) {
        var len = (p.getTotalLength && p.getTotalLength()) || SPOKE_R;
        if (!(len > 0)) len = SPOKE_R;
        len = len * 1.02;
        p.style.strokeDasharray = len + " " + len;
        var start = SEG_1_START + i * SEG_STAGGER;
        // round caps can leave a dot on a zero-length dash — gate visibility to the draw start
        tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, start);
        tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: SEG_DUR, ease: "power2.out" }, start);
      });
      tl.fromTo(mark, { rotation: -22.5 }, { rotation: 0, duration: 1.15, ease: "power2.out", transformOrigin: "50% 50%" }, 0);

      // ── Scene 2 (1.0–1.8s): wordmark builds letter by letter (discrete-text-sequence) ──
      var WORD = "PALLET PRICE SCOUT";
      var TYPE_START = 1.0;
      var SEQUENCE = [{ t: 0, text: "" }];
      var tk = TYPE_START + 0.02;
      for (var i = 1; i <= WORD.length; i++) {
        if (WORD.charAt(i - 1) === " ") { tk += 0.05; continue; } // word-break pause; space lands with the next letter
        SEQUENCE.push({ t: Math.round(tk * 1000) / 1000, text: WORD.slice(0, i) });
        tk += 0.04;
      }
      var TYPE_END = SEQUENCE[SEQUENCE.length - 1].t; // ≈ 1.72s
      var BLINK = 0.28; // one off/on blink after completion, then the cursor leaves

      function textAt(time) {
        for (var k = SEQUENCE.length - 1; k >= 0; k--) {
          if (time >= SEQUENCE[k].t) return SEQUENCE[k].text;
        }
        return "";
      }
      function cursorOn(time) {
        if (time < TYPE_START) return false;
        if (time < TYPE_END) return true;
        if (time >= TYPE_END + BLINK) return false;
        return Math.sin(((time - TYPE_END) / BLINK) * Math.PI * 2 + Math.PI) > 1e-6;
      }
      var driver = { t: 0 };
      function renderType() {
        var s = textAt(driver.t);
        if (textEl.textContent !== s) textEl.textContent = s;
        cursorEl.style.opacity = cursorOn(driver.t) ? "1" : "0";
      }
      tl.fromTo(driver, { t: 0 }, { t: DURATION, duration: DURATION, ease: "none", onUpdate: renderType }, 0);
      renderType();

      // ── Scene 3 (1.8–3.0s): tagline line by line, "place." lands lime on the chime; footer settles last ──
      tl.fromTo(l1, { yPercent: 112 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, 1.8);
      tl.fromTo(l2, { yPercent: 112 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, 1.98);
      tl.fromTo(place, { yPercent: 112 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 2.1);

      tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut", transformOrigin: "50% 50%" }, 2.4);
      tl.fromTo(foot, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.5);

      // ── Scene 4 (3.0–4.5s): hold still; final 0.4s the lockup fades to the ground (final frame) ──
      tl.fromTo(cam, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power1.inOut", immediateRender: false }, DURATION - 0.4);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
