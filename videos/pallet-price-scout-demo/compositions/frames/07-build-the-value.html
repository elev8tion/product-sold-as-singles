  <script>
    (function () {
      "use strict";
      var P = "f07-build-the-value-";
      function $(id) { return document.getElementById(P + id); }

      var tl = gsap.timeline({ paused: true });

      // ---------- virtual camera (viewport-change): ONE state, ONE writer ----------
      // origin 0 0: screen = T + s * pagePoint  →  T = viewCenter − s * target
      var world = $("world");
      var VIEW_CX = 489, VIEW_CY = 339; // window inner center (980×680 minus 1px border)
      var cam = { s: 0.97, cx: 880, cy: 1080 };
      function applyCamera() {
        var tx = VIEW_CX - cam.s * cam.cx;
        var ty = VIEW_CY - cam.s * cam.cy;
        world.style.transform = "translate(" + tx.toFixed(2) + "px, " + ty.toFixed(2) + "px) scale(" + cam.s.toFixed(4) + ")";
      }
      applyCamera();
      function camTo(s, cx, cy, dur, ease, at) {
        tl.to(cam, { s: s, cx: cx, cy: cy, duration: dur, ease: ease, onUpdate: applyCamera }, at);
      }

      // Row centers (page CSS px, from the capture DOM dump): IP 957.5 · Lodge 1016.5 · Levoit 1075.5 · Oster 1134.5
      var ROW = 59, CAM_X = 866;
      var Y_IP = 957.5, Y_LODGE = 1016.5, Y_LEVOIT = 1075.5, Y_OSTER = 1134.5, Y_GROUP = 1046;

      // ---------- Scene 1 (0.0–1.6): establish — window + panel, empty meter, $520 tick ----------
      tl.fromTo($("window"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo($("panel"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.08);
      tl.fromTo($("kicker"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.14);
      tl.fromTo($("tag"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.22);

      // leg 1 — dive in onto the Lodge row (hard out)
      camTo(1.1, CAM_X, Y_LODGE, 1.3, "power4.out", 0);

      tl.fromTo($("label"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.3);
      tl.fromTo($("stat"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.38);
      tl.fromTo($("track"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 0.5);
      tl.fromTo($("tick"), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power3.out" }, 0.85);
      tl.fromTo($("ticklabel"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.9);

      tl.fromTo($("hl"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.95);
      tl.fromTo($("ul-lodge"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 1.05);
      tl.fromTo($("rule1"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 1.2);

      // ---------- Scene 2 (1.6–3.6): line items land one per beat; count + fill in lockstep ----------
      // count mechanics adapted from the installed count-up component: every displayed integer is
      // precomputed per 30fps frame and placed with tl.set — seek-safe, no callbacks.
      var FPS = 30;
      var countEl = $("count");
      var numEl = $("num");
      var fillEl = $("fill");
      var MAX = 540;
      function sOf(v) { return 0.58 + 0.42 * (v / MAX); } // counting-dynamic-scale: weight escalates with value

      function countStep(from, to, at, dur, easeName) {
        var ease = gsap.parseEase(easeName);
        var last = Math.max(1, Math.round(dur * FPS));
        for (var f = 1; f <= last; f += 1) {
          var v = from + (to - from) * ease(f / last);
          tl.set(countEl, { textContent: String(Math.round(v)) }, at + dur * (f / last));
        }
      }

      var steps = [
        { at: 1.6, from: 0,   to: 300, dur: 0.5, ease: "power3.out",   item: "item0" },
        { at: 2.1, from: 300, to: 400, dur: 0.5, ease: "power3.out",   item: "item1" },
        { at: 2.6, from: 400, to: 490, dur: 0.5, ease: "power3.out",   item: "item2" },
        { at: 3.1, from: 490, to: 540, dur: 0.8, ease: "power2.inOut", item: "item3" }
      ];

      steps.forEach(function (st, i) {
        // the line item lands (click-soft on the beat)
        tl.fromTo($(st.item), { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, st.at);
        // the counter (value + scale share timing and ease)
        countStep(st.from, st.to, st.at, st.dur, st.ease);
        if (i === 0) {
          tl.fromTo(numEl, { scale: sOf(st.from) }, { scale: sOf(st.to), duration: st.dur, ease: st.ease }, st.at);
          tl.fromTo(fillEl, { scaleX: 0 }, { scaleX: st.to / MAX, duration: st.dur, ease: st.ease }, st.at);
        } else {
          tl.to(numEl, { scale: sOf(st.to), duration: st.dur, ease: st.ease }, st.at);
          tl.to(fillEl, { scaleX: st.to / MAX, duration: st.dur, ease: st.ease }, st.at);
        }
      });

      // left view steps row to row, arriving just before each item lands (cause → consequence)
      var PAN = 0.36, PAN_EASE = "power2.inOut";
      camTo(1.1, CAM_X, Y_IP, PAN, PAN_EASE, 1.72);
      tl.to($("hl"), { y: -ROW, duration: PAN, ease: PAN_EASE }, 1.72);
      tl.fromTo($("ul-ip"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 1.95);

      camTo(1.1, CAM_X, Y_LEVOIT, PAN, PAN_EASE, 2.22);
      tl.to($("hl"), { y: ROW, duration: PAN, ease: PAN_EASE }, 2.22);
      tl.fromTo($("ul-levoit"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 2.45);

      camTo(1.1, CAM_X, Y_OSTER, PAN, PAN_EASE, 2.72);
      tl.to($("hl"), { y: 2 * ROW, duration: PAN, ease: PAN_EASE }, 2.72);
      tl.fromTo($("ul-oster"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 2.95);

      // ---------- Scene 3 (3.6–5.0): the fill crosses the $520 tick → target reached ----------
      // exact crossing moment of the last fill tween (520/540), solved once at build — deterministic
      var last = steps[3];
      var lastEase = gsap.parseEase(last.ease);
      var need = (520 - last.from) / (last.to - last.from);
      var tCross = 1;
      for (var k = 0; k <= 1000; k += 1) { if (lastEase(k / 1000) >= need) { tCross = k / 1000; break; } }
      var CROSS_AT = last.at + last.dur * tCross;

      tl.to($("tick"), { scaleY: 1.9, duration: 0.14, ease: "power3.out" }, CROSS_AT);
      tl.to($("tick"), { scaleY: 1, duration: 0.3, ease: "power2.out" }, CROSS_AT + 0.14);
      tl.to($("ticklabel"), { color: "#D6FF55", duration: 0.25, ease: "power2.out" }, CROSS_AT);

      // "✓ retail target reached" writes in lime (chime at 3.7)
      tl.fromTo($("checkmark"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 3.7);
      tl.fromTo($("checktext"),
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.out" }, 3.78);

      // the counter lands on $540 with one restrained pulse (count-up landing)
      var LAND = last.at + last.dur;
      tl.to(numEl, { scale: 1.05, duration: 0.16, ease: "power3.out" }, LAND);
      tl.to(numEl, { scale: 1, duration: 0.22, ease: "power2.out" }, LAND + 0.16);

      // "of $520 minimum · 104%" settles under the counter
      tl.fromTo($("min"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.1);

      // leg 3 — pull back to frame the whole built pallet; the focus band widens to all four rows
      camTo(1.04, CAM_X, Y_GROUP, 1.0, "power2.inOut", 3.75);
      tl.to($("hl"), { scaleY: 4, duration: 0.7, ease: "power2.inOut" }, 3.8);

      // ---------- Scene 4 (5.0–7.0): footer rows reveal, then hold ----------
      tl.fromTo($("rule2"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 5.0);
      tl.fromTo($("footl"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.05);
      tl.fromTo($("footr"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.35);

      // landing — near-imperceptible drift so the hold never dies
      camTo(1.054, CAM_X, Y_GROUP, 2.65, "sine.inOut", 4.75);

      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["07-build-the-value"] = tl;
    })();
  </script>
