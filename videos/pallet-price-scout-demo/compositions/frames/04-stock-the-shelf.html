  <script>
    (function () {
      "use strict";
      var ID = "04-stock-the-shelf";
      var P = "f04-stock-the-shelf-";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      function byId(s) { return document.getElementById(P + s); }
      function all(s) { return Array.prototype.slice.call(root.querySelectorAll("." + P + s)); }

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.4s): kicker, then the formula builds token by token ──
      tl.fromTo(byId("kicker"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.05);
      tl.fromTo(byId("tag"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.15);

      // dynamic-content-sequencing: each token's window = BASE + chars × SEC_PER_CHAR (+ hold on figures),
      // reduced ONCE at build into absolute starts. Typing SFX lands at 0.3s.
      var TOK_START = 0.3, TOK_BASE = 0.05, TOK_SEC_PER_CHAR = 0.012, FIG_HOLD = 0.05;
      var cursor = TOK_START;
      var TOKENS = all("tok").map(function (el) {
        var fig = el.classList.contains(P + "fig");
        var dur = TOK_BASE + el.textContent.length * TOK_SEC_PER_CHAR + (fig ? FIG_HOLD : 0);
        var start = cursor;
        cursor += dur;
        return { el: el, fig: fig, start: start, end: cursor };
      });
      TOKENS.forEach(function (t) {
        if (t.fig) {
          // figures 48 / 7 / 2 land from above, in lime
          tl.fromTo(t.el, { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t.start);
        } else {
          tl.fromTo(t.el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, t.start);
        }
      });

      // ── Scene 2 (1.4–2.8s): "= 10" counts 0 → 10, scale growing with the value ──
      // count-up component mechanics: integer rows precomputed per frame, set at fixed
      // timeline positions (seek-safe, no onUpdate). counting-dynamic-scale: value + scale
      // share position, duration and ease. Lands on the pop SFX at 2.1s.
      var valueEl = byId("value");
      var scaler = byId("scaler");
      var COUNT_AT = 1.35, COUNT_DUR = 0.75, START = 0, END = 10, FPS = 30;
      var START_SCALE = 0.5;
      var countEase = gsap.parseEase("power2.out");
      var lastFrame = Math.max(1, Math.round(COUNT_DUR * FPS));
      valueEl.textContent = String(START);
      for (var f = 0; f <= lastFrame; f++) {
        var row = String(Math.round(START + (END - START) * countEase(f / lastFrame)));
        tl.set(valueEl, { textContent: row }, COUNT_AT + COUNT_DUR * (f / lastFrame));
      }
      tl.fromTo(scaler, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, COUNT_AT);
      tl.fromTo(scaler, { scale: START_SCALE }, { scale: 1, duration: COUNT_DUR, ease: "power2.out" }, COUNT_AT);
      // one restrained landing pulse (count-up component), no bounce on the data itself
      var LAND = COUNT_AT + COUNT_DUR;
      tl.to(scaler, { scale: 1.05, duration: 0.15, ease: "power3.out" }, LAND);
      tl.to(scaler, { scale: 1, duration: 0.18, ease: "power2.out" }, LAND + 0.15);
      // UNITS settles beside it after the number owns its beat
      tl.fromTo(byId("units"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.6)" }, LAND);

      // ── Scene 3 (2.8–4.2s): right window, ONE fast zoom punch onto the action bar ──
      // coordinate-target-zoom, nested wrappers: outer scales about the window centre,
      // inner counter-translates by T = -offset (offset = target centre − page centre, page px).
      var PAGE_CX = 960, PAGE_CY = 827.5;          // 1920×1655 CSS-px page
      var BAR_CX = 432 + 1336 / 2, BAR_CY = 1477 + 84 / 2; // "40 units → Main Street store" bar
      var ROW_CY = 678;                             // Ninja air fryer row (pull qty 10) — wide start
      var S0 = 734 / 1920 + 0.0005;                 // page width fits the window
      var S_PEAK = 0.56, S_END = 0.535;             // bar ≈ window width (1336 × 0.535 ≈ 715px)
      var T0 = { x: 0, y: -(ROW_CY - PAGE_CY) };
      var T1 = { x: -(BAR_CX - PAGE_CX), y: -(BAR_CY - PAGE_CY) };
      var outer = byId("zoom-outer");
      var inner = byId("zoom-inner");
      var page = byId("page");
      var WIN_AT = 2.8, ZOOM_AT = 3.0, ZOOM_DUR = 0.75, SETTLE = 0.4;

      tl.fromTo(byId("win"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, WIN_AT);
      // scale + counter-translate share position, duration, ease (whoosh SFX at 3.0s)
      tl.fromTo(outer, { scale: S0 }, { scale: S_PEAK, duration: ZOOM_DUR, ease: "power4.inOut" }, ZOOM_AT);
      tl.fromTo(inner, { x: T0.x, y: T0.y }, { x: T1.x, y: T1.y, duration: ZOOM_DUR, ease: "power4.inOut" }, ZOOM_AT);
      // motion blur peaks at max velocity, resolves at the landing
      tl.fromTo(page, { filter: "blur(0px)" }, { filter: "blur(3px)", duration: ZOOM_DUR / 2, ease: "power2.in" }, ZOOM_AT);
      tl.to(page, { filter: "blur(0px)", duration: ZOOM_DUR / 2, ease: "power2.out" }, ZOOM_AT + ZOOM_DUR / 2);
      // settle: scale eases back to the window-fit; T = -offset keeps the bar centred at any scale
      tl.to(outer, { scale: S_END, duration: SETTLE, ease: "power2.out" }, ZOOM_AT + ZOOM_DUR);

      // readout under the window as the punch lands
      tl.fromTo(byId("stub"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 3.7);
      tl.fromTo(byId("readtext"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.8);

      // ── Scene 4 (4.2–6.0s): the line reveals per phrase, then holds still ──
      var PH_START = 4.2, PH_BASE = 0.36, PH_SEC_PER_CHAR = 0.012;
      var phCursor = PH_START;
      all("phrase").forEach(function (el) {
        var start = phCursor;
        phCursor += PH_BASE + el.textContent.length * PH_SEC_PER_CHAR;
        tl.fromTo(el, { yPercent: 120, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, start);
      });

      // pad the timeline to the fixed 6s frame duration
      tl.fromTo({ p: 0 }, { p: 0 }, { p: 1, duration: 6, ease: "none" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
